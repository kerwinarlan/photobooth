<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📸 Photobooth · Together</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        /* ─── same styles as before ─── */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0b0e; color: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        #app { width: 100%; max-width: 960px; margin: 0 auto; background: #1a1a1f; border-radius: 40px; padding: 24px 20px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.04); position: relative; }
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .app-header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #f5f5f7 60%, #8e8e93); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .app-header .room-badge { background: rgba(255,255,255,0.06); padding: 6px 16px; border-radius: 100px; font-size: 13px; color: #aeaeb2; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 8px; }
        .app-header .room-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; display: inline-block; animation: pulse-dot 1.8s ease-in-out infinite; }
        @keyframes pulse-dot { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(0.8); } }
        .view { display: none; animation: fadeUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeUp { 0%{ opacity:0; transform:translateY(18px); } 100%{ opacity:1; transform:translateY(0); } }
        #joinView { text-align: center; padding: 40px 0 20px; }
        #joinView .icon-big { font-size: 72px; margin-bottom:12px; display:block; }
        #joinView h2 { font-size:30px; font-weight:700; margin-bottom:6px; }
        #joinView p { color:#8e8e93; font-size:16px; margin-bottom:32px; }
        .join-form { display: flex; flex-direction: column; gap: 14px; max-width: 400px; margin: 0 auto; }
        .join-form input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 20px; font-size: 16px; color: #f5f5f7; outline: none; font-family: inherit; }
        .join-form input::placeholder { color:#636366; }
        .join-form input:focus { border-color: rgba(255,215,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, #ffd60a, #f5a623); border: none; border-radius: 16px; padding: 16px 24px; font-size: 17px; font-weight: 600; color: #0b0b0e; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; font-family: inherit; }
        .btn-primary:hover { transform:scale(1.02); box-shadow:0 8px 30px rgba(255,214,10,0.25); }
        .btn-primary:active { transform:scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 22px; font-size: 15px; font-weight: 500; color: #f5f5f7; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .btn-secondary:hover { background: rgba(255,255,255,0.14); }
        .btn-danger { background: rgba(255,69,58,0.15); border: 1px solid rgba(255,69,58,0.2); border-radius: 16px; padding: 12px 20px; font-size: 14px; font-weight: 500; color: #ff453a; cursor: pointer; font-family: inherit; }
        .btn-danger:hover { background: rgba(255,69,58,0.25); }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .video-grid .video-box { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,0.06); }
        .video-grid .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-grid .video-box .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: #fff; pointer-events: none; backdrop-filter: blur(4px); }
        .video-grid .video-box .countdown-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 800; color: #fff; text-shadow: 0 4px 40px rgba(0,0,0,0.8); pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        .video-grid .video-box .countdown-overlay.show { opacity: 1; }
        .video-grid .video-box .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.05s; }
        .video-grid .video-box .flash.go { opacity: 0.8; transition: opacity 0s; }
        .cam-controls { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
        .cam-controls .btn-capture { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffd60a, #e8a800); border: 4px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #0b0b0e; box-shadow: 0 4px 20px rgba(255,214,10,0.2); }
        .cam-controls .btn-capture:hover { transform:scale(1.05); box-shadow:0 8px 40px rgba(255,214,10,0.3); }
        .cam-controls .btn-capture:active { transform:scale(0.92); }
        .cam-controls .btn-capture:disabled { opacity:0.4; cursor:not-allowed; transform:none!important; }
        .cam-controls .btn-capture .inner { width: 52px; height: 52px; border-radius: 50%; background: #ffd60a; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .cam-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin: 12px 0; }
        .photo-card { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .photo-card .avatar { width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: #2a2a2f; margin-bottom: 4px; }
        .photo-card .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-card .avatar .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 32px; color: #636366; background: #1f1f24; }
        .photo-card .name { font-size: 11px; color: #aeaeb2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .photo-card.you { border-color: rgba(255,214,10,0.2); background: rgba(255,214,10,0.04); }
        .status-bar { background: rgba(255,255,255,0.04); border-radius: 16px; padding: 10px 16px; font-size: 14px; color: #8e8e93; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 12px; border: 1px solid rgba(255,255,255,0.04); }
        .status-bar .users { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .status-bar .users .user-badge { background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 100px; font-size: 12px; color: #aeaeb2; }
        .status-bar .users .user-badge.you { color:#ffd60a; border-color: rgba(255,214,10,0.2); }
        .template-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px,1fr)); gap: 10px; margin: 12px 0; }
        .template-option { background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 10px 4px; text-align: center; cursor: pointer; font-family: inherit; color: #f5f5f7; font-size: 12px; transition: border 0.2s; }
        .template-option:hover { background: rgba(255,255,255,0.07); }
        .template-option.active { border-color: #ffd60a; background: rgba(255,214,10,0.08); }
        .template-option .preview { font-size: 28px; display:block; margin-bottom:2px; }
        .template-option .label { font-weight:500; color:#aeaeb2; }
        .strip-preview { display: flex; justify-content: center; margin: 16px 0; }
        .strip-preview canvas { border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); max-width: 100%; max-height: 500px; background: #1a1a1f; border: 1px solid rgba(255,255,255,0.06); }
        .flex-center { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
        .mt-8 { margin-top:8px; }
        .mt-12 { margin-top:12px; }
        .mt-16 { margin-top:16px; }
        .mb-8 { margin-bottom:8px; }
        .text-muted { color:#8e8e93; font-size:14px; }
        .text-center { text-align:center; }
        .hidden { display:none!important; }
        @media (max-width: 600px) { #app { padding: 16px 12px 20px; border-radius:28px; } .video-grid { grid-template-columns:1fr; } .video-grid .video-box { aspect-ratio:4/3; } .app-header h1 { font-size:18px; } .cam-controls .btn-capture { width:60px; height:60px; } .cam-controls .btn-capture .inner { width:44px; height:44px; font-size:22px; } .photo-grid { grid-template-columns: repeat(auto-fill, minmax(70px,1fr)); } }
    </style>
</head>
<body>

<div id="app">
    <header class="app-header">
        <h1>📸 TogetherBooth</h1>
        <div class="room-badge"><span class="dot"></span><span id="roomDisplay">—</span></div>
    </header>

    <!-- JOIN VIEW -->
    <div id="joinView" class="view active">
        <div class="icon-big">🤳</div>
        <h2>Photo Booth, Together</h2>
        <p>Real‑time video &amp; synced captures for you &amp; your partner</p>
        <div class="join-form">
            <input type="text" id="roomInput" placeholder="Room name" value="couple" />
            <input type="text" id="nameInput" placeholder="Your name" value="You" />
            <button class="btn-primary" id="joinBtn">✨ Join the Booth</button>
        </div>
        <div class="mt-16 text-muted" style="font-size:13px;">Works on iPhone, Mac, any browser with camera</div>
    </div>

    <!-- CAMERA VIEW -->
    <div id="cameraView" class="view">
        <!-- Video grid: local + remote -->
        <div class="video-grid" id="videoGrid">
            <div class="video-box" id="localVideoBox">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label" id="localLabel">📷 You</div>
                <div class="countdown-overlay" id="localCountdown"></div>
                <div class="flash" id="localFlash"></div>
            </div>
            <div class="video-box" id="remoteVideoBox">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label" id="remoteLabel">👤 Waiting for friend...</div>
                <div class="countdown-overlay" id="remoteCountdown"></div>
                <div class="flash" id="remoteFlash"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="cam-controls">
            <button class="btn-secondary" id="backToJoinBtn" style="padding:12px 18px; font-size:20px;">←</button>
            <button class="btn-capture" id="captureBtn">
                <span class="inner">📷</span>
            </button>
            <button class="btn-secondary" id="nextStepBtn" style="padding:12px 18px; font-size:20px;">→</button>
        </div>

        <div class="cam-actions">
            <button class="btn-secondary" id="switchCamBtn">🔄 Flip</button>
            <button class="btn-secondary" id="toggleFlashBtn">💡 Flash</button>
            <button class="btn-secondary" id="syncCountdownBtn">⏱️ Start Countdown</button>
            <button class="btn-danger" id="clearPhotosBtn">🗑️ Clear</button>
        </div>

        <!-- My Photos -->
        <div class="mt-12">
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <span style="font-size:14px; font-weight:500; color:#aeaeb2;">📸 My photos</span>
                <span id="myPhotoCount" style="font-size:13px; color:#636366;">0</span>
                <span style="font-size:12px; color:#636366; margin-left:auto;">max 6</span>
            </div>
            <div class="photo-grid" id="myPhotosGrid"></div>
        </div>

        <!-- Friends' Photos -->
        <div class="mt-12">
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <span style="font-size:14px; font-weight:500; color:#aeaeb2;">👥 Friends</span>
                <span id="friendCount" style="font-size:13px; color:#636366;">0</span>
            </div>
            <div class="photo-grid" id="friendsGrid"></div>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <span id="statusText">📷 Ready</span>
            <span id="roomUsersBadge" class="users"></span>
        </div>
    </div>

    <!-- FINAL VIEW -->
    <div id="finalView" class="view">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
            <h2 style="font-size:22px; font-weight:700;">🖼️ Your Photostrip</h2>
            <span style="font-size:13px; color:#636366;">pick a template</span>
        </div>
        <div class="template-selector" id="templateSelector">
            <button class="template-option active" data-template="strip4"><span class="preview">▌▌▌▌</span><span class="label">4‑strip</span></button>
            <button class="template-option" data-template="strip6"><span class="preview">▌▌▌▌▌▌</span><span class="label">6‑strip</span></button>
            <button class="template-option" data-template="grid2x2"><span class="preview">⊞⊞<br>⊞⊞</span><span class="label">2×2</span></button>
            <button class="template-option" data-template="grid3x2"><span class="preview">⊞⊞⊞<br>⊞⊞⊞</span><span class="label">3×2</span></button>
            <button class="template-option" data-template="polaroid"><span class="preview">🖼️</span><span class="label">Polaroid</span></button>
        </div>
        <div class="strip-preview"><canvas id="finalCanvas" width="600" height="800"></canvas></div>
        <div class="flex-center">
            <button class="btn-primary" id="downloadBtn">⬇️ Download PNG</button>
            <button class="btn-secondary" id="backToCameraBtn">📷 Back</button>
            <button class="btn-secondary" id="shareRoomBtn">🔗 Copy Link</button>
        </div>
        <div class="status-bar mt-12"><span id="finalStatus">All photos will be combined.</span></div>
    </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const state = {
    room: '',
    name: '',
    userId: '',
    myPhotos: [],
    friends: {}, // userId -> { name, photos: [] }
    stream: null,
    useFrontCamera: true,
    flashEnabled: false,
    currentTemplate: 'strip4',
    peerConnections: {}, // targetId -> RTCPeerConnection
    remoteStreams: {}, // targetId -> MediaStream
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DOM refs
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const $ = id => document.getElementById(id);
const joinView = $('joinView');
const cameraView = $('cameraView');
const finalView = $('finalView');
const localVideo = $('localVideo');
const remoteVideo = $('remoteVideo');
const localCountdown = $('localCountdown');
const remoteCountdown = $('remoteCountdown');
const localFlash = $('localFlash');
const remoteFlash = $('remoteFlash');
const localLabel = $('localLabel');
const remoteLabel = $('remoteLabel');
const remoteVideoBox = $('remoteVideoBox');

const captureBtn = $('captureBtn');
const switchCamBtn = $('switchCamBtn');
const toggleFlashBtn = $('toggleFlashBtn');
const clearPhotosBtn = $('clearPhotosBtn');
const syncCountdownBtn = $('syncCountdownBtn');
const backToJoinBtn = $('backToJoinBtn');
const nextStepBtn = $('nextStepBtn');
const backToCameraBtn = $('backToCameraBtn');

const roomInput = $('roomInput');
const nameInput = $('nameInput');
const joinBtn = $('joinBtn');
const roomDisplay = $('roomDisplay');
const statusText = $('statusText');
const roomUsersBadge = $('roomUsersBadge');
const friendCount = $('friendCount');
const myPhotoCount = $('myPhotoCount');
const friendsGrid = $('friendsGrid');
const myPhotosGrid = $('myPhotosGrid');

const templateSelector = $('templateSelector');
const finalCanvas = $('finalCanvas');
const downloadBtn = $('downloadBtn');
const shareRoomBtn = $('shareRoomBtn');
const finalStatus = $('finalStatus');

let socket = null;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SOCKET.IO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function connectSocket(room, name) {
    socket = io({ reconnection: true });
    socket.on('connect', () => {
        state.userId = socket.id;
        socket.emit('join', { room, name });
        console.log('🔗 Connected, ID:', socket.id);
    });

    socket.on('room_state', (data) => {
        state.friends = {};
        for (const [id, user] of Object.entries(data.users)) {
            state.friends[id] = { name: user.name, photos: user.photos || [] };
        }
        renderFriends();
        updateStatus();
        updateFinalStrip();
        // ⚠️ Do NOT initiate calls here – we wait for user_joined events
        // (this avoids double offers)
        console.log('📋 Room state received, users:', Object.keys(state.friends));
    });

    socket.on('user_joined', (data) => {
        const { userId, name } = data;
        if (userId === state.userId) return;
        state.friends[userId] = { name, photos: [] };
        renderFriends();
        updateStatus();
        statusText.textContent = `👋 ${name} joined!`;
        setTimeout(() => updateStatus(), 2000);
        // ✅ Initiate WebRTC call to this new user
        console.log('📞 Initiating call to', userId);
        createPeerConnection(userId, true);
    });

    socket.on('user_left', (data) => {
        const { userId } = data;
        delete state.friends[userId];
        closePeerConnection(userId);
        renderFriends();
        updateStatus();
        updateFinalStrip();
    });

    socket.on('peer_disconnected', ({ userId }) => {
        closePeerConnection(userId);
    });

    socket.on('user_photo', (data) => {
        const { userId, photoData, name } = data;
        if (userId === state.userId) return;
        if (!state.friends[userId]) state.friends[userId] = { name: name || 'Friend', photos: [] };
        const friend = state.friends[userId];
        friend.photos.push(photoData);
        if (friend.photos.length > 6) friend.photos.shift();
        renderFriends();
        updateStatus();
        updateFinalStrip();
    });

    socket.on('user_cleared', (data) => {
        const { userId } = data;
        if (userId === state.userId) {
            state.myPhotos = [];
            renderMyPhotos();
            updateStatus();
            updateFinalStrip();
            return;
        }
        if (state.friends[userId]) {
            state.friends[userId].photos = [];
            renderFriends();
            updateFinalStrip();
        }
    });

    // WebRTC signalling
    socket.on('signal', ({ from, signal }) => {
        console.log('📨 Signal from', from, signal.type);
        handleSignal(from, signal);
    });

    // Synchronised countdown
    socket.on('countdown_start', ({ delay, from }) => {
        startGlobalCountdown(delay);
    });

    socket.on('disconnect', () => {
        statusText.textContent = '⚠️ Disconnected — reconnecting…';
    });

    return socket;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WEBCAM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function startCamera(front = true) {
    try {
        if (state.stream) {
            state.stream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
            video: { facingMode: front ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        state.stream = stream;
        localVideo.srcObject = stream;
        await localVideo.play();
        statusText.textContent = '📷 Camera ready';
        return true;
    } catch (err) {
        statusText.textContent = '⚠️ Camera unavailable';
        alert('Camera access required.');
        return false;
    }
}

function stopCamera() {
    if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
        state.stream = null;
        localVideo.srcObject = null;
    }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// WEBRTC
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function createPeerConnection(targetId, initiator = false) {
    if (state.peerConnections[targetId]) {
        console.log('⚠️ Peer connection already exists for', targetId);
        return state.peerConnections[targetId];
    }

    console.log('🛠️ Creating peer connection for', targetId, 'initiator:', initiator);
    const pc = new RTCPeerConnection(iceServers);
    state.peerConnections[targetId] = pc;

    // Add local tracks
    if (state.stream) {
        state.stream.getTracks().forEach(track => {
            pc.addTrack(track, state.stream);
        });
    }

    // Handle remote tracks
    pc.ontrack = (event) => {
        const [stream] = event.streams;
        console.log('📥 Remote stream received from', targetId);
        state.remoteStreams[targetId] = stream;
        // Assign to remote video element
        remoteVideo.srcObject = stream;
        const label = state.friends[targetId]?.name || 'Friend';
        remoteLabel.textContent = `👤 ${label}`;
        remoteVideoBox.style.display = 'block';
        remoteVideo.play().catch(e => console.warn('remote video play error', e));
    };

    pc.onicecandidate = (event) => {
        if (event.candidate) {
            console.log('🧊 Sending ICE candidate to', targetId);
            socket.emit('signal', { targetId, signal: { type: 'candidate', candidate: event.candidate } });
        }
    };

    pc.oniceconnectionstatechange = () => {
        console.log('🔌 ICE state for', targetId, ':', pc.iceConnectionState);
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
            closePeerConnection(targetId);
        }
    };

    if (initiator) {
        // Create offer
        pc.createOffer()
            .then(offer => {
                console.log('📤 Sending offer to', targetId);
                return pc.setLocalDescription(offer);
            })
            .then(() => {
                socket.emit('signal', { targetId, signal: { type: 'offer', sdp: pc.localDescription } });
            })
            .catch(err => console.warn('Offer error:', err));
    }

    return pc;
}

function closePeerConnection(targetId) {
    const pc = state.peerConnections[targetId];
    if (pc) {
        console.log('❌ Closing peer connection for', targetId);
        pc.close();
        delete state.peerConnections[targetId];
    }
    if (state.remoteStreams[targetId]) {
        delete state.remoteStreams[targetId];
    }
    // If remote video element is showing this peer, clear it
    if (remoteVideo.srcObject && remoteVideo.srcObject === state.remoteStreams[targetId]) {
        remoteVideo.srcObject = null;
        remoteVideoBox.style.display = 'block'; // keep visible with waiting label
        remoteLabel.textContent = '👤 Waiting for friend...';
    }
}

function handleSignal(from, signal) {
    console.log('📨 Handling signal from', from, signal.type);
    const pc = state.peerConnections[from];
    if (!pc) {
        // If we receive an offer and we don't have a connection, create one as non-initiator
        if (signal.type === 'offer') {
            console.log('📞 Received offer from', from, '– creating answerer peer');
            createPeerConnection(from, false);
            // Re-enter after creation
            setTimeout(() => handleSignal(from, signal), 100);
            return;
        } else {
            console.warn('⚠️ No peer connection for', from, 'and not an offer – ignoring');
            return;
        }
    }

    if (signal.type === 'offer') {
        pc.setRemoteDescription(new RTCSessionDescription(signal.sdp))
            .then(() => pc.createAnswer())
            .then(answer => pc.setLocalDescription(answer))
            .then(() => {
                console.log('📤 Sending answer to', from);
                socket.emit('signal', { targetId: from, signal: { type: 'answer', sdp: pc.localDescription } });
            })
            .catch(err => console.warn('Answer error:', err));
    } else if (signal.type === 'answer') {
        pc.setRemoteDescription(new RTCSessionDescription(signal.sdp))
            .catch(err => console.warn('Set remote desc error:', err));
    } else if (signal.type === 'candidate') {
        pc.addIceCandidate(new RTCIceCandidate(signal.candidate))
            .catch(err => console.warn('Add ICE error:', err));
    }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CAPTURE (local)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function capturePhoto() {
    if (state.myPhotos.length >= 6) {
        statusText.textContent = '⚠️ Max 6 photos per person';
        return;
    }
    if (state.flashEnabled) {
        localFlash.classList.add('go');
        setTimeout(() => localFlash.classList.remove('go'), 150);
    }

    const canvas = document.createElement('canvas');
    const vw = localVideo.videoWidth || 1280;
    const vh = localVideo.videoHeight || 720;
    canvas.width = vw;
    canvas.height = vh;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(localVideo, 0, 0, vw, vh);
    const dataURL = canvas.toDataURL('image/jpeg', 0.92);

    state.myPhotos.push(dataURL);
    if (state.myPhotos.length > 6) state.myPhotos.shift();
    renderMyPhotos();
    updateStatus();

    socket.emit('photo', { photoData: dataURL });
    statusText.textContent = `📸 Captured! (${state.myPhotos.length}/6)`;
    updateFinalStrip();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SYNCHRONISED COUNTDOWN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let countdownTimer = null;

function startGlobalCountdown(delay = 3) {
    if (countdownTimer) return;
    let count = delay;
    localCountdown.textContent = count;
    remoteCountdown.textContent = count;
    localCountdown.classList.add('show');
    remoteCountdown.classList.add('show');

    countdownTimer = setInterval(() => {
        count -= 1;
        if (count <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            localCountdown.classList.remove('show');
            remoteCountdown.classList.remove('show');
            capturePhoto();
            remoteFlash.classList.add('go');
            setTimeout(() => remoteFlash.classList.remove('go'), 200);
            statusText.textContent = '📸 Synced capture!';
        } else {
            localCountdown.textContent = count;
            remoteCountdown.textContent = count;
        }
    }, 1000);
}

// RENDER functions (unchanged)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderMyPhotos() {
    myPhotosGrid.innerHTML = '';
    state.myPhotos.forEach((url, i) => {
        const div = document.createElement('div');
        div.className = 'photo-card you';
        div.innerHTML = `<div class="avatar"><img src="${url}" alt="my ${i+1}" loading="lazy" /></div><div class="name">#${i+1}</div>`;
        myPhotosGrid.appendChild(div);
    });
    if (state.myPhotos.length === 0) {
        const div = document.createElement('div');
        div.className = 'photo-card';
        div.style.opacity = '0.4';
        div.innerHTML = `<div class="avatar"><div class="placeholder">📷</div></div><div class="name">Take a photo</div>`;
        myPhotosGrid.appendChild(div);
    }
    myPhotoCount.textContent = state.myPhotos.length;
}

function renderFriends() {
    friendsGrid.innerHTML = '';
    let count = 0;
    // Self
    const selfDiv = document.createElement('div');
    selfDiv.className = 'photo-card you';
    const lastSelf = state.myPhotos.length > 0 ? state.myPhotos[state.myPhotos.length-1] : null;
    selfDiv.innerHTML = `
        <div class="avatar">${lastSelf ? `<img src="${lastSelf}" alt="you" />` : `<div class="placeholder">👤</div>`}</div>
        <div class="name">${state.name} (you)</div>
        <div class="name" style="font-size:10px;color:#636366;">${state.myPhotos.length} photos</div>
    `;
    friendsGrid.appendChild(selfDiv);
    count++;

    for (const [id, friend] of Object.entries(state.friends)) {
        if (id === state.userId) continue;
        const div = document.createElement('div');
        div.className = 'photo-card';
        const last = friend.photos.length > 0 ? friend.photos[friend.photos.length-1] : null;
        div.innerHTML = `
            <div class="avatar">${last ? `<img src="${last}" alt="${friend.name}" />` : `<div class="placeholder">👤</div>`}</div>
            <div class="name">${friend.name}</div>
            <div class="name" style="font-size:10px;color:#636366;">${friend.photos.length} photos</div>
        `;
        friendsGrid.appendChild(div);
        count++;
    }
    friendCount.textContent = count;
    updateRoomUsers();
}

function updateRoomUsers() {
    const names = [state.name];
    for (const [id, friend] of Object.entries(state.friends)) {
        if (id === state.userId) continue;
        names.push(friend.name);
    }
    const html = names.map(n => `<span class="user-badge${n === state.name ? ' you' : ''}">${n}</span>`).join('');
    roomUsersBadge.innerHTML = html;
}

function updateStatus() {
    const total = Object.keys(state.friends).length + 1;
    statusText.textContent = `👥 ${total} in room · 📸 ${state.myPhotos.length} photos`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// FINAL STRIP (same as before, omitted for brevity – it's unchanged)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getAllPhotos() {
    const all = [];
    for (const p of state.myPhotos) all.push({ dataURL: p, name: state.name, isSelf: true });
    for (const [id, friend] of Object.entries(state.friends)) {
        if (id === state.userId) continue;
        for (const p of friend.photos) all.push({ dataURL: p, name: friend.name, isSelf: false });
    }
    return all;
}

function updateFinalStrip() {
    const template = state.currentTemplate;
    const photos = getAllPhotos();
    if (photos.length === 0) {
        finalStatus.textContent = '📸 No photos yet — take some!';
        const ctx = finalCanvas.getContext('2d');
        ctx.fillStyle = '#1a1a1f';
        ctx.fillRect(0,0,finalCanvas.width,finalCanvas.height);
        ctx.fillStyle = '#636366';
        ctx.font = '20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Take photos to see your strip ✨', finalCanvas.width/2, finalCanvas.height/2);
        return;
    }
    finalStatus.textContent = `🖼️ ${photos.length} photos · template: ${template}`;
    renderTemplate(template, photos);
}

function renderTemplate(template, photos) {
    const canvas = finalCanvas;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);

    function drawRoundedRect(ctx,x,y,w,h,r) {
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);
        ctx.arcTo(x,y,x+w,y,r);
        ctx.closePath();
    }

    function drawPhoto(ctx, img, x, y, w, h, r=8) {
        drawRoundedRect(ctx,x,y,w,h,r);
        ctx.save();
        ctx.clip();
        ctx.drawImage(img,x,y,w,h);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        drawRoundedRect(ctx,x,y,w,h,r);
        ctx.stroke();
    }

    function loadImage(url) { return new Promise(resolve => { const img = new Image(); img.onload = ()=>resolve(img); img.onerror=()=>resolve(null); img.src=url; }); }

    const loadPromises = photos.map(p => loadImage(p.dataURL));
    Promise.all(loadPromises).then(images => {
        const valid = images.filter(img => img !== null);
        if (valid.length === 0) return;
        while (valid.length < 4) valid.push(valid[valid.length-1] || valid[0]);
        const used = valid.slice(0,8);

        ctx.fillStyle = '#1a1a1f';
        ctx.fillRect(0,0,W,H);
        const pad = 24, gap = 10;
        const innerW = W - pad*2, innerH = H - pad*2;

        if (template === 'strip4' || template === 'strip6') {
            const count = template === 'strip4' ? 4 : 6;
            const total = Math.min(used.length, count);
            const photoH = (innerH - (total-1)*gap) / total;
            const photoW = innerW * 0.72;
            const offsetX = (W - photoW) / 2;
            ctx.fillStyle = '#1e1e24';
            ctx.fillRect(0,0,W,H);
            ctx.strokeStyle = 'rgba(255,215,0,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(pad,pad,innerW,innerH);
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.font = '12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('📸 PHOTOBOOTH', W/2, 18);
            for (let i=0; i<total; i++) {
                const y = pad + i*(photoH+gap);
                const img = used[i % used.length];
                if (img) {
                    drawPhoto(ctx, img, offsetX, y, photoW, photoH, 8);
                    const label = photos[i % photos.length]?.name || '';
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '10px system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(label, W/2, y+photoH+14);
                }
            }
        } else if (template === 'grid2x2') {
            const cols=2, rows=2;
            const total=Math.min(used.length, cols*rows);
            const cellW=(innerW-(cols-1)*gap)/cols, cellH=(innerH-(rows-1)*gap)/rows;
            for (let i=0; i<total; i++) {
                const r=Math.floor(i/cols), c=i%cols;
                const x=pad+c*(cellW+gap), y=pad+r*(cellH+gap);
                const img=used[i%used.length];
                if (img) drawPhoto(ctx, img, x, y, cellW, cellH, 10);
            }
        } else if (template === 'grid3x2') {
            const cols=3, rows=2;
            const total=Math.min(used.length, cols*rows);
            const cellW=(innerW-(cols-1)*gap)/cols, cellH=(innerH-(rows-1)*gap)/rows;
            for (let i=0; i<total; i++) {
                const r=Math.floor(i/cols), c=i%cols;
                const x=pad+c*(cellW+gap), y=pad+r*(cellH+gap);
                const img=used[i%used.length];
                if (img) drawPhoto(ctx, img, x, y, cellW, cellH, 10);
            }
        } else if (template === 'polaroid') {
            const mainImg = used[0];
            const photoW = innerW * 0.78;
            const photoH = photoW * 0.8;
            const x = (W - photoW)/2;
            const y = pad + 30;
            ctx.fillStyle = '#2a2a2f';
            const border = 14;
            const bw = photoW + border*2;
            const bh = photoH + border*2 + 40;
            const bx = x - border;
            const by = y - border;
            drawRoundedRect(ctx,bx,by,bw,bh,6);
            ctx.fill();
            if (mainImg) drawPhoto(ctx, mainImg, x, y, photoW, photoH, 4);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(photos[0]?.name || '📸', W/2, y+photoH+28);
            const extra = used.slice(1,4);
            const thumbSize = 50;
            const spacing = 12;
            const totalW = extra.length * thumbSize + (extra.length-1)*spacing;
            let sx = (W - totalW)/2;
            const sy = y + photoH + 52;
            for (const img of extra) {
                if (img) { drawPhoto(ctx, img, sx, sy, thumbSize, thumbSize, 4); sx += thumbSize + spacing; }
            }
        }
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.font = '10px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✦ togetherbooth.app ✦', W/2, H-8);
    });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NAVIGATION & JOIN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

async function joinRoom() {
    const room = roomInput.value.trim() || 'couple';
    const name = nameInput.value.trim() || 'You';
    state.room = room;
    state.name = name;
    roomDisplay.textContent = `#${room}`;

    connectSocket(room, name);
    const ok = await startCamera(state.useFrontCamera);
    if (!ok) return;

    showView('cameraView');
    renderMyPhotos();
    renderFriends();
    updateStatus();
    updateFinalStrip();
    state.myPhotos = [];
    renderMyPhotos();
    if (socket) socket.emit('cleared');
}

// EVENT BINDINGS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
joinBtn.addEventListener('click', joinRoom);

nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') joinBtn.click(); });

captureBtn.addEventListener('click', capturePhoto);

switchCamBtn.addEventListener('click', async () => {
    state.useFrontCamera = !state.useFrontCamera;
    await startCamera(state.useFrontCamera);
    statusText.textContent = `🔄 ${state.useFrontCamera ? 'Front' : 'Back'} camera`;
});

toggleFlashBtn.addEventListener('click', () => {
    state.flashEnabled = !state.flashEnabled;
    toggleFlashBtn.textContent = state.flashEnabled ? '💡 On' : '💡 Flash';
    toggleFlashBtn.style.borderColor = state.flashEnabled ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.08)';
});

clearPhotosBtn.addEventListener('click', () => {
    if (state.myPhotos.length === 0) return;
    if (!confirm('Clear all your photos?')) return;
    state.myPhotos = [];
    renderMyPhotos();
    updateStatus();
    updateFinalStrip();
    socket.emit('cleared');
    statusText.textContent = '🗑️ Photos cleared';
});

syncCountdownBtn.addEventListener('click', () => {
    if (!socket) return;
    socket.emit('start_countdown', { delay: 3 });
    startGlobalCountdown(3);
});

backToJoinBtn.addEventListener('click', () => {
    stopCamera();
    if (socket) socket.disconnect();
    showView('joinView');
});

nextStepBtn.addEventListener('click', () => {
    const all = getAllPhotos();
    if (all.length < 2) {
        statusText.textContent = '⚠️ Need at least 2 photos total';
        return;
    }
    showView('finalView');
    updateFinalStrip();
});

backToCameraBtn.addEventListener('click', () => {
    showView('cameraView');
    renderFriends();
    renderMyPhotos();
    updateFinalStrip();
});

templateSelector.addEventListener('click', (e) => {
    const btn = e.target.closest('.template-option');
    if (!btn) return;
    document.querySelectorAll('.template-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentTemplate = btn.dataset.template;
    updateFinalStrip();
});

downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `photobooth-${state.room}-${Date.now()}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
});

shareRoomBtn.addEventListener('click', () => {
    const url = `${window.location.origin}?room=${encodeURIComponent(state.room)}`;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
            finalStatus.textContent = '✅ Room link copied!';
        }).catch(() => prompt('Copy this link:', url));
    } else {
        prompt('Copy this link:', url);
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === ' ' && cameraView.classList.contains('active')) {
        e.preventDefault();
        captureBtn.click();

        if (finalView.classList.contains('active')) backToCameraBtn.click();
